<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admin Dashboard</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div class="bg-dark text-white p-3 sidebar" id="sidebar">
    <h4 class="text-center">Admin Panel</h4>
    <hr>

    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white menu-link" data-page="dashboard" href="#">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white menu-link" data-page="students" href="#">Students</a></li>
      <li class="nav-item"><a class="nav-link text-white menu-link" data-page="exams" href="#">Exams</a></li>
      <li class="nav-item"><a class="nav-link text-white menu-link" data-page="settings" href="#">Settings</a></li>
    </ul>
  </div>

  <!-- Page Content -->
  <div class="container-fluid p-4" id="content-area">

    <!-- Default Dashboard -->
    <h2>Dashboard</h2>

    <div class="row mt-4">
      <div class="col-md-3">
        <div class="card text-bg-primary mb-3">
          <div class="card-body">
            <h5>Total Students</h5>
            <h3>1200</h3>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card text-bg-success mb-3">
          <div class="card-body">
            <h5>Teachers</h5>
            <h3>85</h3>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card text-bg-warning mb-3">
          <div class="card-body">
            <h5>Exams</h5>
            <h3>12</h3>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card text-bg-danger mb-3">
          <div class="card-body">
            <h5>Departments</h5>
            <h3>6</h3>
          </div>
        </div>
      </div>
    </div>

    <div id="dynamic-content" class="mt-4"></div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
